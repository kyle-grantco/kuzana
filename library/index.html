<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kuzana Library</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <!--
      Kuzana Library Page
      - Top bar with: Search Books, Borrow Books, Lend Books
      - Borrow form: URL (LinkedIn or other), Book (populated from Google Sheet)
      - Lend form: URL (LinkedIn), Book Name (free text)
      - Success messaging on submission
    -->
</head>
<body>
    <a class="skip-link" href="#library-main">Skip to content</a>

    <main id="library-main" class="main-content" style="max-width: 900px;">
        <h1>Decentralized Library of Kuzana</h1>

        <!-- Section Tabs -->
        <nav aria-label="Library actions" style="width: 100%; margin: 1rem 0 1.5rem;">
            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                <a id="searchBooksLink" class="cta-button" href="https://docs.google.com/spreadsheets/d/13qeTLyxRiL53bA-z8DVo6Vft8ie2Jla9uzLGIk9jVBE/edit?gid=0#gid=0" target="_blank" rel="noopener">Search Books</a>

            </div>
        </nav>

        <!-- Info note -->
        <p class="highlight" style="width: 100%;">Borrowers: paste your LinkedIn, email (or other public social) profile URL and select a book.</p>

        <!-- Borrow Form -->
        <section id="borrow" aria-labelledby="borrow-title">
            <form id="borrowForm" novalidate style="display: grid; gap: 0.75rem;">
                <label for="borrowerUrl"><strong>How to reach you</strong></label>
                <input
                    id="borrowerUrl"
                    name="borrowerUrl"
                    type="text"
                    placeholder="LinkedIn URL or email (e.g., https://linkedin.com/in/you or you@email.com)"
                    inputmode="email"
                    required
                    title="Please enter a valid LinkedIn URL or email address"
                    style="padding: 0.65rem; border: 1px solid #ddd; border-radius: 6px;"
                    aria-describedby="borrowerUrlHelp"
                />

                <label for="bookSelect"><strong>Book</strong></label>
                <select
                    id="bookSelect"
                    name="book"
                    required
                    style="padding: 0.65rem; border: 1px solid #ddd; border-radius: 6px;"
                    aria-describedby="bookHelp"
                >
                    <option value="">Loading books…</option>
                </select>

                <button id="borrowSubmitBtn" type="submit" class="cta-button" style="align-self: flex-start;">Check Out Book</button>

                <div id="borrowSuccess" role="status" aria-live="polite" style="display:none; color: #1a7f37; font-weight: 700;">✅ Book successfully checked out</div>
                <div id="borrowError" role="alert" style="display:none; color: #b00020; font-weight: 700;"></div>
            </form>
        </section>

        <!-- Divider -->
        <hr style="width: 100%; border: none; border-top: 1px solid #eee; margin: 2rem 0;" />

        <!-- Lend Form -->
        <section id="lend" aria-labelledby="lend-title">
            <h2 id="lend-title">Lend Books</h2>
            <form id="lendForm" novalidate style="display: grid; gap: 0.75rem;">
                <label for="lenderUrl"><strong>How to reach you</strong></label>
                <input
                    id="lenderUrl"
                    name="lenderUrl"
                    type="text"
                    placeholder="LinkedIn URL or email (e.g., https://linkedin.com/in/you or you@email.com)"
                    inputmode="email"
                    required
                    title="Please enter a valid LinkedIn URL or email address"
                    style="padding: 0.65rem; border: 1px solid #ddd; border-radius: 6px;"
                />

                <input
                    id="lendBookName"
                    name="bookName"
                    type="text"
                    placeholder="Book Name e.g., Creative Capital by Jane Doe"
                    required
                    minlength="2"
                    style="padding: 0.65rem; border: 1px solid #ddd; border-radius: 6px;"
                />

                <button id="lendSubmitBtn" type="submit" class="cta-button" style="align-self: flex-start;">Offer to Lend</button>

                <div id="lendSuccess" role="status" aria-live="polite" style="display:none; color: #1a7f37; font-weight: 700;">✅ Thanks! Book offering recorded</div>
                <div id="lendError" role="alert" style="display:none; color: #b00020; font-weight: 700;"></div>
            </form>
        </section>

        <!-- Fallback links -->
        <section aria-label="Helpful links" style="margin-top: 2rem;">
            <p>Having trouble? You can <a href="https://docs.google.com/spreadsheets/d/13qeTLyxRiL53bA-z8DVo6Vft8ie2Jla9uzLGIk9jVBE/edit?gid=0#gid=0" target="_blank" rel="noopener">view the Library list</a> directly.</p>
        </section>
    </main>

    <script>
    (function() {
        /**
         * Constants: Replace APPS_SCRIPT_* with your deployed Web App URLs.
         * SHEET_ID is the Google Sheet ID for the Library.
         */
        var SHEET_ID = '13qeTLyxRiL53bA-z8DVo6Vft8ie2Jla9uzLGIk9jVBE';
        var PUBLISHED_E_ID = '2PACX-1vTzSB5ePznlprqm2jmEH6xAfs8rjU9jb4TQiKwJY6jFoZU2dWWizxxT5b9wXjuV_d-yQ0uhIleD07bd'; // from publish-to-web URL
        var LIBRARY_SHEET_NAME = 'Library'; // change if your tab is named differently
        var LIBRARY_GID = '0'; // adjust if Library tab gid is not 0
        // Try multiple endpoints in order to avoid CORS / gid mismatches
        var SHEETS_CSV_URLS = [
            // 1) published-to-web CSV (preferred when available)
            'https://docs.google.com/spreadsheets/d/e/' + PUBLISHED_E_ID + '/pub?output=csv&gid=' + LIBRARY_GID,
            'https://docs.google.com/spreadsheets/d/e/' + PUBLISHED_E_ID + '/pub?output=csv',
            // 2) gviz by sheet name (works when sheet is viewable by link)
            'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(LIBRARY_SHEET_NAME),
            // 3) published CSV on doc id (requires Publish to web)
            'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/pub?output=csv&gid=' + LIBRARY_GID,
            // 4) direct export by gid
            'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=' + LIBRARY_GID
        ];
        var APPS_SCRIPT_BORROW_URL = 'https://script.google.com/macros/s/AKfycbyqFoz324taaWy9_0wYmdjAP2xiSaO0HtaQ9Dc2b5XfVSksCvt6Zz3-wafkDpc_7MieTw/exec';
        var APPS_SCRIPT_LEND_URL = 'https://script.google.com/macros/s/AKfycbyqFoz324taaWy9_0wYmdjAP2xiSaO0HtaQ9Dc2b5XfVSksCvt6Zz3-wafkDpc_7MieTw/exec';

        /**
         * isValidUrl: robust URL validation using the URL constructor.
         * Returns true only when the URL has a valid protocol and hostname.
         */
        function isValidUrl(value) {
            try {
                var u = new URL(value);
                if (!/^https?:$/.test(u.protocol)) return false;
                return !!u.hostname;
            } catch (e) { return false; }
        }

        function isValidEmail(value) {
            return /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i.test((value || '').trim());
        }

        function isValidContact(value) {
            return isValidUrl(value) || isValidEmail(value);
        }

        /**
         * parseCsvRows: very simple CSV parsing for rows/columns.
         * Assumes minimal commas within fields. For titles containing commas,
         * consider switching to Apps Script JSON endpoint instead.
         */
        function parseCsvRows(csv) {
            return csv
                .split(/\r?\n/)
                .filter(function(line) { return line.trim().length > 0; })
                .map(function(line) { return line.split(','); });
        }

        /**
         * populateBooks: fetches Library sheet CSV, finds the "Book" column,
         * and fills the dropdown with non-empty values from row 2..n.
         */
        function populateBooks() {
            var select = document.getElementById('bookSelect');
            if (!select) return;
            select.innerHTML = '<option value=\"\">Loading books…</option>';

            tryFetchCsvSequential(SHEETS_CSV_URLS)
              .then(function(text) {
                  var rows = parseCsvRows(text);
                  if (rows.length < 2) throw new Error('No rows found');
                  var header = rows[0];
                  var bookColIndex = header.findIndex(function(h) { return /^(book)$/i.test(h.trim()); });
                  if (bookColIndex === -1) throw new Error('Book column not found');

                  var options = [];
                  for (var i = 1; i < rows.length; i++) {
                      var book = (rows[i][bookColIndex] || '').trim();
                      if (book.length) options.push(book);
                  }

                  options = Array.from(new Set(options))
                    .sort(function(a, b) { return a.localeCompare(b, undefined, { sensitivity: 'base' }); });
                  select.innerHTML = '<option value=\"\">Select a book</option>';
                  options.forEach(function(b) {
                      var opt = document.createElement('option');
                      opt.value = b;
                      opt.textContent = b;
                      select.appendChild(opt);
                  });
              })
              .catch(function(err) {
                  console.error(err);
                  select.innerHTML = '<option value=\"\">Unable to load books</option>';
                  var errBox = document.getElementById('borrowError');
                  if (errBox) {
                      errBox.style.display = 'block';
                      errBox.textContent = 'Could not load book list. Ensure the Library tab exists and is accessible. If needed, publish the sheet to the web (File → Share → Publish to web) and set the correct tab name/gid in the page.';
                  }
              });
        }

        /**
         * Tries a list of URLs sequentially and resolves with the first successful text response.
         */
        function tryFetchCsvSequential(urls) {
            var idx = 0;
            return new Promise(function(resolve, reject) {
                function next() {
                    if (idx >= urls.length) return reject(new Error('All CSV endpoints failed'));
                    var url = urls[idx++];
                    fetch(url, { method: 'GET' })
                      .then(function(res) {
                          if (!res.ok) throw new Error('HTTP ' + res.status);
                          return res.text();
                      })
                      .then(resolve)
                      .catch(function() { next(); });
                }
                next();
            });
        }

        /**
         * Button loading helpers
         */
        function setButtonWorking(btn) {
            if (!btn) return;
            if (!btn.dataset.originalText) btn.dataset.originalText = btn.textContent;
            btn.textContent = 'Working, give me 5 seconds...';
            btn.disabled = true;
            btn.setAttribute('aria-busy', 'true');
            btn.style.opacity = '0.7';
            btn.style.cursor = 'not-allowed';
        }

        function clearButtonWorking(btn) {
            if (!btn) return;
            btn.textContent = btn.dataset.originalText || btn.textContent;
            btn.disabled = false;
            btn.removeAttribute('aria-busy');
            btn.style.opacity = '';
            btn.style.cursor = '';
        }
        /**
         * handleBorrowSubmit: validates inputs and POSTs to Apps Script.
         * On success, clears the form and shows success message.
         */
        function handleBorrowSubmit(e) {
            e.preventDefault();
            var urlInput = document.getElementById('borrowerUrl');
            var bookSelect = document.getElementById('bookSelect');
            var submitBtn = document.getElementById('borrowSubmitBtn');
            var success = document.getElementById('borrowSuccess');
            var error = document.getElementById('borrowError');
            if (success) success.style.display = 'none';
            if (error) { error.style.display = 'none'; error.textContent = ''; }

            var borrowerUrl = (urlInput && urlInput.value || '').trim();
            var book = (bookSelect && bookSelect.value || '').trim();
            if (!borrowerUrl || !isValidContact(borrowerUrl)) {
                if (error) { error.style.display = 'block'; error.textContent = 'Please enter a valid LinkedIn URL or email address.'; }
                if (urlInput) urlInput.focus();
                return;
            }
            if (!book) {
                if (error) { error.style.display = 'block'; error.textContent = 'Please select a book.'; }
                if (bookSelect) bookSelect.focus();
                return;
            }
            if (/REPLACE_BORROW_DEPLOY_ID/.test(APPS_SCRIPT_BORROW_URL)) {
                if (error) { error.style.display = 'block'; error.textContent = 'Borrow endpoint not configured. Replace APPS_SCRIPT_BORROW_URL with your Apps Script Web App URL.'; }
                return;
            }

            setButtonWorking(submitBtn);
            var payload = { action: 'borrow', borrowerUrl: borrowerUrl, book: book };
            fetch(APPS_SCRIPT_BORROW_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: new URLSearchParams(payload).toString()
            })
            .then(function() {
                if (success) success.style.display = 'block';
                if (urlInput) urlInput.value = '';
                if (bookSelect) bookSelect.value = '';
                setTimeout(function(){ clearButtonWorking(submitBtn); }, 5000);
            })
            .catch(function(err) {
                console.error(err);
                if (error) { error.style.display = 'block'; error.textContent = 'Could not check out book. Please try again.'; }
                clearButtonWorking(submitBtn);
            });
        }

        /**
         * handleLendSubmit: validates inputs and POSTs to Apps Script.
         */
        function handleLendSubmit(e) {
            e.preventDefault();
            var urlInput = document.getElementById('lenderUrl');
            var bookInput = document.getElementById('lendBookName');
            var submitBtn = document.getElementById('lendSubmitBtn');
            var success = document.getElementById('lendSuccess');
            var error = document.getElementById('lendError');
            if (success) success.style.display = 'none';
            if (error) { error.style.display = 'none'; error.textContent = ''; }

            var lenderUrl = (urlInput && urlInput.value || '').trim();
            var bookName = (bookInput && bookInput.value || '').trim();
            if (!lenderUrl || !isValidContact(lenderUrl)) {
                if (error) { error.style.display = 'block'; error.textContent = 'Please enter a valid LinkedIn URL or email address.'; }
                if (urlInput) urlInput.focus();
                return;
            }
            if (!bookName) {
                if (error) { error.style.display = 'block'; error.textContent = 'Please enter a book name.'; }
                if (bookInput) bookInput.focus();
                return;
            }
            if (/REPLACE_LEND_DEPLOY_ID/.test(APPS_SCRIPT_LEND_URL)) {
                if (error) { error.style.display = 'block'; error.textContent = 'Lend endpoint not configured. Replace APPS_SCRIPT_LEND_URL with your Apps Script Web App URL.'; }
                return;
            }

            setButtonWorking(submitBtn);
            var payload = { action: 'lend', lenderUrl: lenderUrl, bookName: bookName };
            fetch(APPS_SCRIPT_LEND_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: new URLSearchParams(payload).toString()
            })
            .then(function() {
                if (success) success.style.display = 'block';
                if (urlInput) urlInput.value = '';
                if (bookInput) bookInput.value = '';
                setTimeout(function(){ clearButtonWorking(submitBtn); }, 5000);
            })
            .catch(function(err) {
                console.error(err);
                if (error) { error.style.display = 'block'; error.textContent = 'Could not record the book offering. Please try again.'; }
                clearButtonWorking(submitBtn);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            populateBooks();
            var borrowForm = document.getElementById('borrowForm');
            var lendForm = document.getElementById('lendForm');
            if (borrowForm) borrowForm.addEventListener('submit', handleBorrowSubmit);
            if (lendForm) lendForm.addEventListener('submit', handleLendSubmit);
        });
    })();
    </script>

</body>
</html>
