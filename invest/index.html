  <main class="main-content">
    <section class="invest-hero">
      <h1>Kuzana Pitch Deck</h1>
      <p>Enter your work email to receive the deck.</p>
    </section>

    <section class="form-card">
      <form id="investForm" novalidate>
        <div class="form-row">
          <input id="email" name="email" type="email" placeholder="name@company.com" required pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" aria-label="Email address">
          <button class="cta-button" type="submit">View Deck</button>
        </div>
        <p class="error" id="errorMsg">Please enter a valid email like abc@abc.abc</p>
        <p class="success" id="successMsg">Check your inbox for the deck. Opening now…</p>
      </form>
    </section>

  </main>


  <script src="../script.js"></script>
  <script>
    (function(){
      /**
       * Validate email against a simple pattern requiring a dot in the domain
       */
      function isValidEmail(email){
        var pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return pattern.test(String(email).toLowerCase());
      }

      var form = document.getElementById('investForm');
      var emailInput = document.getElementById('email');
      var err = document.getElementById('errorMsg');
      var ok = document.getElementById('successMsg');
      var deckUrl = 'https://docs.google.com/presentation/d/1JmAZx8-Xn2RiYaf2zFdluSwWno6XM6sNaq99fTgoCf8/view';

      form.addEventListener('submit', function(e){
        e.preventDefault();
        err.style.display = 'none';
        ok.style.display = 'none';
        var email = emailInput.value.trim();
        if(!isValidEmail(email)) { err.style.display = 'block'; return; }

        // Replace with your deployed Apps Script Web App URL
        var GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyZfwwHYuDu3YNqqNdXH1qVF0Gx6qujdfoc5OLkbmqQF6LUXl_OvBXqUENjkBfu4JMg/exec';

        fetch(GAS_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, deckUrl: deckUrl })
        }).catch(function(){ /* ignore network visibility due to no-cors */ });

        ok.style.display = 'block';
        window.open(deckUrl, '_blank', 'noopener');
      });
    })();
  </script>
