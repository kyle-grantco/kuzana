<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Submitted | Kuzana</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
      color: #1a1a1a;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px;
      text-align: center;
    }

    .logo {
      max-width: 240px;
      margin-bottom: 56px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    h2 {
      font-size: 26px;
      margin: 0 0 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 10px;
      color: #3a3a3a;
    }

    .cta {
      margin-top: 28px;
    }

    /* Button: filled -> outline on hover */
    .button {
      display: inline-block;
      padding: 16px 34px;
      background: #f26d6d;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      border: 2px solid #f26d6d;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .button:hover {
      background: transparent;
      color: #f26d6d;
      transform: translateY(-1px);
    }

    .subtext {
      margin-top: 14px;
      font-size: 14px;
      color: #777;
    }

    .footer {
      margin-top: 72px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="images/kuzana-logo.jpg" alt="Kuzana Logo" class="logo" />

    <h1>Application Submitted ✅</h1>
    <h2>You’re done.</h2>

    <p>Thanks, we’ve received your full application.</p>
    <p>We’ll review it and email you the next steps if you’re selected.</p>

    <div class="cta">
      <a
        href="https://kuzana.co"
        class="button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Back to Kuzana
      </a>

      <div class="subtext">
        Please keep an eye on your email.
      </div>
    </div>

    <div class="footer">
      © Kuzana. All rights reserved.
    </div>
  </div>

</body>
</html>
