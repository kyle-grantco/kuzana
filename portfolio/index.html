    /* Offset content below fixed header */
    body { padding-top: 90px; }
    .portfolio-hero { padding: 6rem 1rem 2rem; text-align: center; }
    .portfolio-hero h1 { color: var(--tertiary); }
    .logo-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1.5rem;
      align-items: center;
      justify-items: center;
      padding: 1rem;
      max-width: 1000px;
      margin: 0 auto 3rem;
    }
    .logo-card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 1rem; width: 100%; display: flex; align-items: center; justify-content: center; aspect-ratio: 4 / 3; }
    .logo-card img { max-width: 90%; max-height: 80%; object-fit: contain; display: block; }
    @media (max-width: 900px) { .logo-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { .logo-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
  <meta name="description" content="Kuzana portfolio: businesses we've helped grow." />
