<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Redirects kuzana.co/event to the hosted form at form.kuzana.co/event. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <script>
        (function () {
            var target = 'https://form.kuzana.co/event';
            var q = window.location.search || '';
            window.location.replace(target + q);
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="https://form.kuzana.co/event">the event form</a>…</p>
</body>
</html>
