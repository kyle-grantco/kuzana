<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting…</title>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://docs.google.com" crossorigin>
    <script>
        (function() {
            var pathname = window.location.pathname || "/";
            var segment = pathname.replace(/^\/+|\/+$/g, "").split("/")[0];
            // "Original part of the URL after kuzana.co" (path + any query string).
            var originalAfterDomain = pathname.replace(/^\/+/, "").replace(/\/+$/g, "");
            var search = window.location.search || "";
            if (search) originalAfterDomain += search;
            var ignored = ["", "index.html", "index.htm", "favicon.ico", "robots.txt"];
            if (ignored.indexOf(segment) !== -1) {
                window.location.replace("/");
                return;
            }
            var target = "/?referrer=" + encodeURIComponent(originalAfterDomain);
            window.location.replace(target);
        })();
    </script>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; color: #333; }
        a { color: #ff6f74; }
    </style>
</head>
<body>
    <p>Redirecting you to the application form… If you are not redirected, continue to the
        <a href="https://form.kuzana.co/apply">application</a>.
    </p>
</body>
</html>
