<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting…</title>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://docs.google.com" crossorigin>
    <script>
        (function() {
            var pathname = window.location.pathname || "/";
            var parts = pathname.replace(/^\/+|\/+$/g, "").split("/");
            var segment = parts[0] || "";
            var search = window.location.search || "";
            var ignored = ["", "index.html", "index.htm", "favicon.ico", "robots.txt"];

            // /class/[name] → /class?referral=[name]
            if (segment === "class" && parts.length >= 2 && parts[1] && parts[1] !== "index.html") {
                var params = new URLSearchParams(search);
                params.set("referral", parts[1]);
                window.location.replace("/class?" + params.toString());
                return;
            }

            if (ignored.indexOf(segment) !== -1) {
                window.location.replace("/");
                return;
            }

            var referralCode = pathname.replace(/^\/+/, "").replace(/\/+$/g, "");
            if (search) referralCode += search;
            window.location.replace("/?referral=" + encodeURIComponent(referralCode));
        })();
    </script>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; color: #333; }
        a { color: #ff6f74; }
    </style>
</head>
<body>
    <p>Redirecting… If you are not redirected, continue to the
        <a href="https://kuzana.co/">Kuzana homepage</a>.
    </p>
</body>
</html>
