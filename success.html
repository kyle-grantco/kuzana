<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Submitted | Kuzana</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
      color: #1a1a1a;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px;
      text-align: center;
    }

    .logo {
      max-width: 240px;
      margin-bottom: 56px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 22px;
      color: #3a3a3a;
    }

    .highlight {
      margin: 40px auto 0;
      padding: 28px 32px;
      background: #ffffff;
      border-radius: 14px;
      font-size: 19px;
      font-weight: 600;
      max-width: 560px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      letter-spacing: -0.2px;
    }

    .cta {
      margin-top: 36px;
    }

    .button {
      display: inline-block;
      padding: 16px 34px;
      background: #1a1a1a;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      opacity: 0.95;
    }

    .footer {
      margin-top: 72px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="images/kuzana-logo.jpg" alt="Kuzana Logo" class="logo" />

    <h1>Application received ✅</h1>

    <p>
      Thanks for applying to Kuzana. Your submission is confirmed and now under review.
    </p>

    <p>
      If you’re selected for the next batch, you’ll hear from us by email with next steps.
    </p>

    <div class="highlight">
      We help companies 2× in 12 weeks with half the stress.
    </div>

    <div class="cta">
      <a href="https://kuzana.co" class="button">
        Back to Kuzana
      </a>
    </div>

    <div class="footer">
      © Kuzana. All rights reserved.
    </div>
  </div>

</body>
</html>
