<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles.css">

    <meta property="og:title" content="Access Kuzana Deck">
    <meta property="og:description" content="Request access to the Kuzana pitch deck.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/images/kuzana-logo.png">

    <style>
        .deck-form-container {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .deck-form {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 2.5em 2em 2em 2em;
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5em;
        }
        .deck-form label {
            font-weight: 500;
            color: var(--tertiary);
            margin-bottom: 0.5em;
        }
        .deck-form input[type="email"] {
            padding: 0.8em;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        .deck-form button {
            margin-top: 1em;
            padding: 0.8em 1.5em;
            border-radius: 4px;
            border: none;
            background: var(--secondary);
            color: #fff;
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .deck-form button:hover {
            background: #fff;
            color: var(--secondary);
            border: 1px solid var(--secondary);
        }
        .deck-form button:disabled {
            opacity: 0.7;
            cursor: wait;
        }
        .deck-form .error {
            color: #b00020;
            display: none;
        }
        .deck-form .success {
            color: #0a7a38;
            display: none;
        }
    </style>
</head>
<body>
    <nav class="main-nav">
        <div class="logo">
            <a href="https://kuzana.co">
                <img src="../images/logo.png" class="image-placeholder">
            </a>
        </div>
        <button class="menu-toggle" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="nav-links">
            <li><a href="/referral/" class="nav-link">Referral</a></li>
            <li><a href="/faq/" class="nav-link">FAQ</a></li>
            <li><a href="https://kuzana.co/class#free" class="nav-link">Class</a></li>
            <li><a href="https://kuzana.substack.com" class="nav-link">Blog</a></li>
            <li><a href="/library/" class="nav-link">Library</a></li>
            <li><a href="/resources/" class="nav-link">Resources</a></li>
            <li><a href="https://form.kuzana.co/apply" class="cta-button">Apply Now</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="deck-form-container">
            <form class="deck-form" id="deckAccessForm">
                <label for="email">Enter your email to access the Kuzana Deck:</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com" autocomplete="email">
                <button type="submit" id="deckSubmitButton">Access Kuzana Deck</button>
                <p id="deckError" class="error">Please enter a valid email like name@company.com.</p>
                <p id="deckSuccess" class="success">Check your email for access to the deck.</p>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="newsletter">
                <h3>Stay Updated</h3>
                <p>
                    <iframe src="https://kuzana.substack.com/embed" width="480" height="320" style="border:1px solid #EEE; background:white;" frameborder="0" scrolling="no"></iframe>
                </p>
            </div>
            <div class="address">
                <p>Spring Valley Rd, Nairobi, Kenya</p>
            </div>
            <ul class="social-links">
                <li><a href="https://www.linkedin.com/company/kuzana" target="_blank">LinkedIn</a></li>
                <li><a href="https://kuzana.substack.com" target="_blank">Substack</a></li>
                <li><a href="https://www.tiktok.com/@kuzana.co" target="_blank">TikTok</a></li>
                <li><a href="https://www.instagram.com/kuzana.co/" target="_blank">Instagram</a></li>
                <li><a href="https://x.com/kuzana_co" target="_blank">X</a></li>
                <li><a href="https://www.facebook.com/kuzana" target="_blank">Facebook</a></li>
                <li><a href="mailto:info+website@kuzana.co">Email</a></li>
            </ul>
        </div>
    </footer>
    <script src="../script.js"></script>
    <script>
        (function () {
            var form = document.getElementById('deckAccessForm');
            var emailInput = document.getElementById('email');
            var submitButton = document.getElementById('deckSubmitButton');
            var errorMsg = document.getElementById('deckError');
            var successMsg = document.getElementById('deckSuccess');
            var GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxXIVLZBH3XplnP4RgTx6OIs5ZNyIkymkPKHRBNXW0YwXDSu0naMkUJjhmHKUHXfVDM/exec';

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email).toLowerCase());
            }

            form.addEventListener('submit', function (e) {
                var email;

                e.preventDefault();
                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';

                email = (emailInput.value || '').trim();
                if (!isValidEmail(email)) {
                    errorMsg.style.display = 'block';
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent = 'Submitting...';

                fetch(GAS_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        context: 'deck_request',
                        source: 'deck_landing'
                    })
                }).catch(function () {
                    // Apps Script no-cors responses are opaque; network visibility is limited in the browser.
                }).finally(function () {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Access Kuzana Deck';
                    successMsg.style.display = 'block';
                    form.reset();
                });
            });
        })();
        </script>

</body>
</html>
