<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Redirects kuzana.co/c to /class/, which carries the query string into the Finance for Founders form. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <script>
        (function () {
            var target = '/class/';
            var q = window.location.search || '';
            window.location.replace(target + q);
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="/class/">Finance for Founders</a>…</p>
</body>
</html>
