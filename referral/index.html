  <style>
    body {

  <script>
    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function generateLink() {
      const emailField = document.getElementById("email");
      const email = emailField.value.trim().toLowerCase();

      if (email && !validateEmail(email)) {
        alert("Please enter a valid email address.");
        return;
      }

      const shortUrl = `${window.location.origin}/${email}`;
      const displayUrl = `Kuzana.co/${email}`;

      document.getElementById("result").value = displayUrl;

      const whatsappMsg = `Hey Friend, Are you looking to raise capital for your business? I saw this and thought of you.\n\nKuzana invests in Kenyan businesses with Ksh 300k+ monthly revenue.\n\nUse this link to show that I promoted you: ${shortUrl}`;
      const linkedinMsg = `Hey Friends. I found this funding opportunity for startups in Kenya and wanted to share with my network.\n\nKuzana invests in Kenyan businesses with Ksh 300k+ monthly revenue.\n\n${shortUrl}`;
      const emailMsg = `Hey Friend!\n\nAre you looking to raise capital for your business? I saw this and thought of you.\n\nKuzana invests in Kenyan businesses with Ksh 300k+ monthly revenue.\n\nUse this link to show that I promoted you: ${shortUrl}`;

      document.getElementById("whatsapp").href = `https://wa.me/?text=${encodeURIComponent(whatsappMsg)}`;
      document.getElementById("linkedin").href = `linkedin://shareArticle?mini=true&url=${shortUrl}&title=${encodeURIComponent('Kuzana Funding Opportunity')}&summary=${encodeURIComponent(linkedinMsg)}`;
      document.getElementById("emailShare").href = `mailto:?subject=Check this out&body=${encodeURIComponent(emailMsg)}`;

      document.getElementById("shareSection").style.display = 'block';
    }

    function copyLink() {
      const resultField = document.getElementById("result");
      const value = resultField.value;
      if (!value) { alert("Generate a link first."); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(function(){
          
        }).catch(function(){
          const ta = document.createElement('textarea');
          ta.value = value;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = value;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }
  </script>

  <div class="content-wrapper">
    <p><strong>Want to Promote a friend's company?</strong></p>
    <p>We'll offer up to <strong>Ksh50,000</strong>* if we invest.</p>
    <h2>Generate Your Custom Kuzana Link</h2>

    <label>Your Email:<br>
      <input type="email" id="email">
    </label>

    <button onclick="generateLink()">Generate Link</button>

    <div id="shareSection" style="margin-top: 2em; display: none;">
      <h3>Your Link:</h3>
      <input type="text" id="result" readonly>
      <button type="button" onclick="copyLink()">Copy</button>

      <a id="whatsapp" target="_blank">Share on WhatsApp</a>
      <a id="linkedin" target="_blank">Share on LinkedIn</a>
      <a id="emailShare" target="_blank">Share by Email</a>
    </div>
    <p class="small-text">*<a href="terms.html" target="_blank" text="tertiary">Terms and conditions apply</a></p>
  </div>
