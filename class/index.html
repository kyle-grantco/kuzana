<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Kuzana Class: full-page Tally embed (Finance for Founders) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="robots" content="index, follow">
    <title>Finance for Founders | Kuzana Class</title>
    <meta name="description" content="Finance for Founders — Kuzana’s class for Kenyan CEOs who want to know what their business is worth and how to grow it.">
    <link rel="canonical" href="https://kuzana.co/class/">
    <meta property="og:site_name" content="Kuzana">
    <meta property="og:url" content="https://kuzana.co/class/">
    <meta property="og:title" content="Finance for Founders | Kuzana Class">
    <meta property="og:description" content="Finance for Founders with Kuzana.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://kuzana.co/images/kuzana-logo.png">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <script src="/attribution.js"></script>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        html { margin: 0; height: 100%; overflow: hidden; }
        body { margin: 0; height: 100%; overflow: hidden; }
        iframe {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            border: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <iframe
        id="class-tally"
        data-tally-src="https://tally.so/r/BE4OpA?transparentBackground=1&formEventsForwarding=1"
        width="100%"
        height="100%"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="Finance for Founders">
    </iframe>
    <script>
        (function () {
            /**
             * Copies this page’s query params onto the Tally embed URL so hidden
             * fields (referral, source, email, etc.) can be captured in submissions.
             */
            function forwardQueryParams() {
                var frame = document.getElementById('class-tally');
                if (!frame) return;
                var base = frame.getAttribute('data-tally-src') || '';
                try {
                    var url = new URL(base, window.location.origin);
                    var incoming = new URLSearchParams(window.location.search || '');
                    incoming.forEach(function (value, key) {
                        if (value) url.searchParams.set(key, value);
                    });
                    frame.setAttribute('data-tally-src', url.toString());
                } catch (err) {}
            }

            /**
             * Loads Tally embeds, with a fallback if the widget script is slow.
             */
            function loadTallyEmbeds() {
                forwardQueryParams();
                if (typeof Tally !== 'undefined') {
                    Tally.loadEmbeds();
                    return;
                }
                document.querySelectorAll('iframe[data-tally-src]:not([src])').forEach(function (frame) {
                    frame.src = frame.dataset.tallySrc;
                });
            }

            if (typeof Tally !== 'undefined') loadTallyEmbeds();
            else window.addEventListener('load', loadTallyEmbeds);
        }());
    </script>
    <script src="/metricool.js" defer></script>
</body>
</html>
