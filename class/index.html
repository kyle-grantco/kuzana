<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Finance for Founders | Free Course for Kenyan SMEs | Kuzana</title>
    <meta name="description" content="A free, self-paced finance course for Kenyan founders. Learn to read your numbers, set pricing and build the financial habits investors look for.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://kuzana.co/class/">
    <meta property="og:site_name" content="Kuzana">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kuzana.co/class/">
    <meta property="og:title" content="Finance for Founders | Kuzana">
    <meta property="og:description" content="A free, self-paced finance course for Kenyan founders. Learn the financial habits investors look for.">
    <meta property="og:image" content="https://kuzana.co/images/kuzana-logo.png">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <style type="text/css">
      html { margin: 0; height: 100%; overflow: hidden; }
      iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border: 0; }
    </style>
</head>
<body>
    <iframe id="class-frame" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" title="Finance for Founders"></iframe>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var source = params.get('source') || params.get('utm_source');
            if (!source) {
                var clickIds = { fbclid: 'facebook', ttclid: 'tiktok', gclid: 'google', li_fat_id: 'linkedin', twclid: 'x' };
                for (var id in clickIds) {
                    if (params.get(id)) { source = clickIds[id]; break; }
                }
            }
            if (!source && document.referrer) {
                try {
                    var host = new URL(document.referrer).hostname.replace(/^(www|m|l|lm)\./, '');
                    var hosts = { 'facebook.com': 'facebook', 'instagram.com': 'instagram', 'linkedin.com': 'linkedin', 'lnkd.in': 'linkedin', 'tiktok.com': 'tiktok', 't.co': 'x', 'x.com': 'x', 'twitter.com': 'x', 'wa.me': 'whatsapp', 'whatsapp.com': 'whatsapp', 'youtube.com': 'youtube' };
                    source = hosts[host] || (host.indexOf('google.') !== -1 ? 'google' : host);
                } catch (e) {}
            }
            source = source || 'direct';
            var tag = params.get('tag') || params.get('utm_content') || '';
            if (!tag) {
                var reserved = { source:1, utm_source:1, campaign:1, utm_campaign:1, tag:1, utm_content:1, fbclid:1, ttclid:1, gclid:1, li_fat_id:1, twclid:1 };
                params.forEach(function(v, k) { if (!reserved[k] && !tag) tag = k; });
            }
            if (tag) source = source + '-' + tag;
            var campaign = params.get('campaign') || params.get('utm_campaign') || 'class';
            var tallySrc = 'https://tally.so/r/BE4OpA?transparentBackground=1&formEventsForwarding=1'
                + '&s=' + encodeURIComponent(source)
                + '&c=' + encodeURIComponent(campaign);
            if (document.referrer) tallySrc += '&referrer=' + encodeURIComponent(document.referrer);
            var frame = document.getElementById('class-frame');
            frame.setAttribute('data-tally-src', tallySrc);
            var s = document.createElement('script');
            s.src = 'https://tally.so/widgets/embed.js';
            document.head.appendChild(s);
        })();
    </script>
</body>
</html>
